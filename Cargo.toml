[package]
name = "jero-arch-mistral"
description = "Mistral and Mixtral architecture recipe (SWA and Sparse MoE) for the SpacemiT K3 platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/LMA1980/jero-arch-mistral"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[dependencies]
jero-core = { version = "0.1.0", git = "https://github.com/LMA1980/jero-core.git", branch = "main" }
jero-kernels-rvv = { version = "0.1.0", git = "https://github.com/LMA1980/jero-kernels-rvv.git", branch = "main", optional = true }

[features]
default = ["with-kernels"]
with-kernels = ["dep:jero-kernels-rvv"]
